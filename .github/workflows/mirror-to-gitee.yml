name: mirror-to-gitee

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours, UTC
  workflow_dispatch:

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH key for Gitee
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa gitee.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mirror all owned non-fork repos to Gitee
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
          GH_USER: 123123213weqw
          GITEE_USER: wangyue2006
        run: |
          set -u

          # NOTE: this repo is public and workflow logs are world-readable, so
          # private repo names must never appear in the log. Report by index only.

          : > repos.txt
          page=1
          while :; do
            resp=$(curl -sfS -H "Authorization: token $GH_PAT" \
              "https://api.github.com/user/repos?affiliation=owner&type=owner&per_page=100&page=${page}")
            count=$(printf '%s' "$resp" | jq 'length')
            [ "${count:-0}" -eq 0 ] && break
            printf '%s' "$resp" | jq -r '.[] | select(.fork == false and .name != "gitee-mirror") | .name' >> repos.txt
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          total=$(wc -l < repos.txt)
          [ "$total" -gt 0 ] || { echo "repo listing failed"; exit 1; }
          echo "Mirroring $total repos"

          failures=0
          i=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            i=$((i + 1))
            rm -rf m.git
            if ! git clone --quiet --mirror \
                 "https://x-access-token:${GH_PAT}@github.com/${GH_USER}/${name}.git" m.git >/dev/null 2>&1; then
              echo "[$i/$total] FAILED (fetch)"
              failures=$((failures + 1))
              continue
            fi
            # Drop GitHub-only ref namespaces (pull request refs etc.) so the
            # mirror push contains exactly heads and tags.
            git -C m.git for-each-ref --format='%(refname)' \
              | grep -vE '^refs/(heads|tags)/' \
              | while IFS= read -r ref; do git -C m.git update-ref -d "$ref"; done
            if git -C m.git push --quiet --mirror "git@gitee.com:${GITEE_USER}/${name}.git" >/dev/null 2>&1; then
              echo "[$i/$total] ok"
            else
              echo "[$i/$total] FAILED (push - Gitee repo missing?)"
              failures=$((failures + 1))
            fi
          done < repos.txt

          echo "Done: $((total - failures))/$total ok, $failures failed"
          [ "$failures" -eq 0 ]

      - name: Keep-alive commit (prevents 60-day schedule auto-disable)
        if: ${{ always() }}
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git config user.name "mirror-bot"
          git config user.email "123123213weqw@users.noreply.github.com"
          git add .last-run
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: keep-alive [skip ci]"
            git push -q "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
